[package]
name = "rustc-deepseek-harness"
version = "0.26.8-15.5"
edition = "2021"
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1.0.104"
notify = "8.2.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3"
tao = "0.36.0"
toml = "1.1.4"
wry = "0.56.1"
zip = "8.6.0"
